<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character & Word Counter · Dark mode · Draft</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Note counter</h1>
        <textarea id="note-text" placeholder="Write something…" rows="6"></textarea>

        <div class="counter-panel">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
        </div>

        <div class="actions">
            <button id="clear-btn" type="button">Clear</button>
            <button id="theme-toggle" type="button">Dark mode</button>
        </div>
    </main>
</body>
</html>
